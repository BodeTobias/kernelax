# Tests on GitHub's ubuntu-24.04 runners (x86-64, 2 vCPU for private repositories, 4 for public ones; AVX-512 where the
# VM has it). kernelax builds its kernels with the newest gcc >= 12 on the PATH: conda-forge's gcc 15 (with a glibc 2.39
# sysroot for libmvec), in one cell the system's gcc 13.3 (GCC PR target/117159 in gcc 12-14: its AVX-512 mask spills,
# which the kernels avoid; test_f32 checks the assembly of every gcc-NN on the PATH); exported libraries build with the
# host's compiler, also gcc 13.3. A tag v* runs the same, uploads the tested sdist and wheel to PyPI (publish:
# trusted publishing, no token; the package's version must be the tag's) and then makes the GitHub release (release:
# with the files; Zenodo archives it and gives it a DOI).
name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all tests, Python 3.13
            python: "3.13"
            tests: tests
          - name: quick tests, Python 3.12
            python: "3.12"
            tests: tests/test_cases.py tests/test_f32.py tests/test_int.py tests/test_math.py tests/test_kernel.py
          - name: quick tests, gcc tuned for Sapphire Rapids
            python: "3.13"
            tests: tests/test_cases.py tests/test_f32.py tests/test_int.py tests/test_math.py tests/test_kernel.py
            mtune: sapphirerapids
          - name: quick tests, kernels built with the system's gcc 13
            python: "3.13"
            tests: tests/test_cases.py tests/test_f32.py tests/test_int.py tests/test_math.py tests/test_kernel.py
            kernelax_cc: gcc-13
          - name: exports built with the system's gcc 13
            python: "3.13"
            tests: tests/test_export.py
            host_cc: gcc-13
    defaults:
      run:
        shell: bash -el {0}
    env:
      JAX_PLATFORMS: cpu
      KERNELAX_CACHE_DIR: ${{ github.workspace }}/../kernelax-cache
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: kernelax
          create-args: >-
            python=${{ matrix.python }} gcc=15 gxx=15 gfortran=15 sysroot_linux-64=2.39 make
          init-shell: bash
      - name: kernelax and its dependencies
        run: pip install -e ".[dev]"
      - name: Compiler wrapper (KERNELAX_CC)
        if: matrix.mtune
        run: |
          printf '#!/bin/sh\nexec gcc "$@" -mtune=%s\n' "${{ matrix.mtune }}" > "$RUNNER_TEMP/gcc-tuned"
          chmod +x "$RUNNER_TEMP/gcc-tuned"
          echo "KERNELAX_CC=$RUNNER_TEMP/gcc-tuned" >> "$GITHUB_ENV"
      - name: Machine
        run: |
          nproc; grep -m1 "model name" /proc/cpuinfo
          grep -qw avx512f /proc/cpuinfo && echo "AVX-512" || echo "no AVX-512 (W = 4)"
          gcc --version | head -1
      - name: Tests
        run: |
          if [ -n "${{ matrix.kernelax_cc }}" ]; then
            export KERNELAX_CC=/usr/bin/${{ matrix.kernelax_cc }} KERNELAX_CXX=/usr/bin/$(echo ${{ matrix.kernelax_cc }} | sed 's/gcc/g++/')
            $KERNELAX_CC --version | head -1
          fi
          if [ -n "${{ matrix.host_cc }}" ]; then  # (after the environment's activation, which sets CC and CXX)
            export CC=/usr/bin/${{ matrix.host_cc }} CXX=/usr/bin/$(echo ${{ matrix.host_cc }} | sed 's/gcc/g++/')
            $CC --version | head -1
          fi
          python -m pytest -q -p no:cacheprovider ${{ matrix.tests }}

  package:
    name: sdist and wheel, installed and tested
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    env:
      JAX_PLATFORMS: cpu
      KERNELAX_CACHE_DIR: ${{ github.workspace }}/../kernelax-cache
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: kernelax
          create-args: >-
            python=3.13 gcc=15 gxx=15 sysroot_linux-64=2.39 make
          init-shell: bash
      - name: Build (the wheel from the sdist)
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: The version is the tag's
        if: startsWith(github.ref, 'refs/tags/v')
        run: test -f "dist/kernelax-${GITHUB_REF_NAME#v}-py3-none-any.whl" || { ls dist; exit 1; }
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: dist
          path: dist/
      - name: Install the wheel into a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl pytest
      - name: Tests against the installed package
        run: |
          "$RUNNER_TEMP/venv/bin/python" -c "import kernelax; print(kernelax.__version__, kernelax.__file__); assert 'site-packages' in kernelax.__file__"
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q -p no:cacheprovider tests/test_cases.py tests/test_export.py

  publish:
    name: upload to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cpu, package]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/kernelax/
    permissions:
      id-token: write  # (PyPI's trusted publishing)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release with the files uploaded to PyPI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "kernelax ${GITHUB_REF_NAME#v}" --generate-notes
