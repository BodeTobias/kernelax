[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelax"
dynamic = ["version"]
description = "Fused, vectorized and multithreaded C and CUDA kernels from JAX"
readme = "README.md"
authors = [{ name = "Tobias Bode" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = ["jax>=0.12.1,<0.13", "jaxlib>=0.12.1,<0.13", "numpy>=2.0", "scipy>=1.12"]  # (JAX's internals: kernelax/internals.py; raised once a release is tested)
keywords = ["jax", "jit", "compiler", "kernel fusion", "simd", "openmp", "cuda", "finite elements", "automatic differentiation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/BodeTobias/kernelax"
Repository = "https://github.com/BodeTobias/kernelax"
Issues = "https://github.com/BodeTobias/kernelax/issues"
Documentation = "https://github.com/BodeTobias/kernelax/blob/main/docs/reference.md"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.dynamic]
version = { attr = "kernelax.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kernelax = ["runtime.cpp", "gpu_runtime.cu"]
